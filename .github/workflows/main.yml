name: A workflow for my Hello World App

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup network
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo:7
          docker run -d --name mongo-dbserver --network se-methods mongo:7

      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Build Docker Image
        run: docker build -t se_methods .

      - name: Run image
        run: docker run --network se-methods --name devopscontainer se_methods

      - name: View application logs
        if: always()
        run: docker logs devopscontainer
