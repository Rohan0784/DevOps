name: DevOps CI

on:
  push:
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run unit tests
        run: mvn --batch-mode -Dtest=com.napier.devops.AppTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Start database
        run: docker compose up --build -d db

      - name: Wait for employee database
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T db mysql \
              -uroot -pexample \
              -Nse "SELECT COUNT(*) FROM employees.employees" \
              >/dev/null 2>&1; then
              echo "Employee database is ready"
              exit 0
            fi

            echo "Waiting for employee database: attempt ${attempt}"
            sleep 5
          done

          docker compose logs db
          exit 1

      - name: Run integration tests
        run: mvn --batch-mode -Dtest=com.napier.devops.AppIntegrationTest test

      - name: Clean up integration database
        if: always()
        run: docker compose down

  Build:
    name: Build and Docker Compose Test
    runs-on: ubuntu-22.04
    needs: [UnitTests, IntegrationTests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Package application
        run: mvn --batch-mode package -DskipTests

      - name: Run Docker Compose
        env:
          COMPOSE_MENU: "false"
        run: docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: Clean up Docker Compose
        if: always()
        run: docker compose down